name: Build MacroFlow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore project structure from ZIP
        run: |
          ZIP=$(ls MacroFlow*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "No ZIP found - building repository as is"
            exit 0
          fi
          echo "Found $ZIP - restoring project structure"
          mkdir -p /tmp/restore
          unzip -q "$ZIP" -d /tmp/restore
          SRC=$(find /tmp/restore -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$SRC"
          git ls-files | grep -v '/' | grep -v -x "$ZIP" | xargs -r git rm -q -f
          rm -rf "$SRC/.github"
          cp -a "$SRC"/. ./
          git rm -q -f "$ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore MacroFlow project structure"
          git push

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MacroFlow-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: MacroFlow-Release-APK-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
